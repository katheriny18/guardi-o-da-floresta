<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião da Biodiversidade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameWrap">
  <div id="header"><span>⭐ <span id="score">0</span></span><span>⏱️ <span id="time">60</span>s</span><span>❤️ <span id="lives">3</span></span></div>
  <canvas id="canvas" width="420" height="600"></canvas>
  <div id="controls"><button class="btn" id="leftBtn">◀️ ESQUERDA</button><button class="btn" id="rightBtn">DIREITA ▶️</button></div>

  <div id="rules">
    <h1>🌎 Guardião da Biodiversidade</h1>
    <p style="text-align:center"><p>
      <h3>Salve a Mata Atlântica!</h3>
    <p><b>REGRAS:</b> Colete animais nativos, desvie de fogo e lixo</p>
    <p><b>PONTOS:</b> 🐒+20 | 🐆+15 | 🦜+10 | 🔥-15</p>
    <button id="startBtn" style="margin-top:20px;padding:15px;background:#ffca28;border:none;border-radius:14px;font-weight:bold;font-size:18px;">COMEÇAR A PROTEGER ▶️</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
