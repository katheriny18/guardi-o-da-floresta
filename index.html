<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião da Floresta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameContainer">
  <div id="topo">⭐ <b id="score">0</b> | ❤️ <b id="lives">3</b> | ⏰ <b id="time">90</b> | Fase <b id="level">1</b></div>
  <canvas id="canvas" width="420" height="600"></canvas>
  <div id="controls"><button id="leftBtn">⬅️</button><button id="rightBtn">➡️</button></div>
  <div id="capa">
    <h1>🌳 Guardião da<br>Floresta</h1>
    <p class="sub">Salve os animais em extinção!</p>
    <div class="regras">
      FASE 1: 🦜 Arara-azul, 🐒 Mico-leão, 🐢 Tartaruga<br>
      FASE 2: 🐆 Onça-pintada, 🐺 Lobo-guará, 🦥 Tamanduá<br>
      FASE 3: 🦦 Ariranha, 🐊 Jacaré-açu, 🦜 Papagaio
    </div>
    <button id="startBtn">🌱 JOGAR</button>
  </div>
  <div id="avisoFase" class="hidden">
    <div class="avisoBox"><span id="avisoEmoji">🎉</span><h2 id="avisoTitulo"></h2><p id="avisoTexto"></p></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
