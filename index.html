<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião da Floresta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameContainer">
  <div id="info">
    <span>⭐ <span id="score">0</span></span>
    <span>❤️ <span id="lives">3</span></span>
    <span>⏱️ <span id="time">90</span>s</span>
    <span>🌲 Fase <span id="level">1</span>/5</span>
  </div>
  <canvas id="canvas" width="420" height="600"></canvas>

  <div id="controls">
    <button id="leftBtn">⬅️</button>
    <button id="rightBtn">➡️</button>
  </div>

  <div id="rules">
    <h2>🌳 Guardião da Floresta</h2>
    <p>Use as SETAS ou A/D no PC<br>ou os BOTÕES no celular</p>
    <p>🦜 Pegue os animais<br>🔥 Desvie do fogo</p>
    <button id="startBtn">JOGAR</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
