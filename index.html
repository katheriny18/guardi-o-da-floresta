<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião da Floresta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameContainer">
  <div id="topo">
    <span>⭐ <b id="score">0</b></span>
    <span>❤️ <b id="lives">3</b></span>
    <span>⏱️ <b id="time">90</b>s</span>
    <span>🌲 Fase <b id="level">1</b>/5</span>
  </div>
  <canvas id="canvas" width="420" height="600"></canvas>
  <div id="controls">
    <button id="leftBtn">⬅️</button>
    <button id="rightBtn">➡️</button>
  </div>
  <div id="capa">
    <h1>🌳 Guardião da Floresta</h1>
    <p>Salve os animais da Amazônia!</p>
    <div class="regras">
      <p>🦜🐒🦋 Pegue os animais = +20 pts</p>
      <p>🔥🪓 Desvie do fogo</p>
      <p>⌨️ PC: SETAS ou A e D</p>
      <p>📱 Celular: Botões ⬅️ ➡️</p>
    </div>
    <button id="startBtn">JOGAR</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
