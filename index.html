<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardião da Floresta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameContainer">
  <div id="topo">
    <span>⭐ <b id="score">0</b></span>
    <span>❤️ <b id="lives">3</b></span>
    <span>⏰ <b id="time">90</b></span>
    <span>🌳 Fase <b id="level">1</b></span>
  </div>
  <canvas id="canvas" width="420" height="600"></canvas>
  <div id="controls">
    <button id="leftBtn">⬅️</button>
    <button id="rightBtn">➡️</button>
  </div>

  <div id="capa">
    <h1>🌳 Guardião da<br>Floresta</h1>
    <p class="sub">Salve a Amazônia!</p>
    <div class="regras">
      FASE 1: 🦜 Arara, 🐒 Mico, 🦋 Borboleta (20pts)<br>
      FASE 2: 🐢 Tartaruga, 🐊 Jacaré, 🐸 Sapo (30pts)<br>
      FASE 3: 🐆 Onça, 🦥 Preguiça, 🐍 Cobra (40pts)<br>
      <b>Precisa de 200 pontos pra passar!</b>
    </div>
    <button id="startBtn">🌱 JOGAR</button>
  </div>

  <div id="avisoFase" class="hidden"></div>

</div>
<script src="script.js"></script>
</body>
</html>
